<body data-page="tutorials" data-theme="dark">
  <script>
    (function () {
      var theme = 'dark';
      try {
        var stored = localStorage.getItem('stemora:theme') || localStorage.getItem('stemora:welcome-theme');
        theme = stored === 'light' ? 'light' : 'dark';
      } catch (error) {}
      document.body.dataset.theme = theme;
      if (document.body.dataset.page === 'welcome') {
        document.body.dataset.welcomeTheme = theme;
      } else if (theme === 'dark') {
        document.body.classList.add('page-immersive');
      }
      document.documentElement.style.colorScheme = theme;
    })();
  </script>
