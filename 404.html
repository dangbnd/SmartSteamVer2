<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Không tìm thấy trang | SMARTSTEAM</title>
  <meta name="description" content="Trang bạn yêu cầu không tồn tại hoặc đã được gỡ khỏi SMARTSTEAM.">
  <meta name="robots" content="noindex,nofollow">
  <link rel="icon" href="/assets/img/logo.svg" type="image/svg+xml">
  <style>
    :root {
      color-scheme: dark;
      --bg: #101820;
      --card: #f5ead8;
      --ink: #17202a;
      --muted: #596273;
      --accent: #e56f3f;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      background:
        radial-gradient(circle at top left, rgba(229, 111, 63, 0.34), transparent 34rem),
        linear-gradient(135deg, #101820 0%, #1b2b32 58%, #34251d 100%);
      font-family: Georgia, "Times New Roman", serif;
      color: var(--ink);
    }

    main {
      width: min(680px, 100%);
      padding: clamp(32px, 8vw, 72px);
      border: 1px solid rgba(255, 255, 255, 0.45);
      border-radius: 32px;
      background: var(--card);
      box-shadow: 0 28px 80px rgba(0, 0, 0, 0.32);
    }

    p:first-child {
      margin: 0 0 16px;
      color: var(--accent);
      font: 700 0.82rem/1.2 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      letter-spacing: 0.16em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: clamp(2.4rem, 9vw, 5.8rem);
      line-height: 0.92;
      letter-spacing: -0.06em;
    }

    p {
      max-width: 36rem;
      color: var(--muted);
      font-size: 1.06rem;
      line-height: 1.7;
    }

    a {
      display: inline-flex;
      align-items: center;
      min-height: 44px;
      margin-top: 14px;
      padding: 0 18px;
      border-radius: 999px;
      background: var(--ink);
      color: #fff7ea;
      font: 700 0.92rem/1 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      text-decoration: none;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }
  </style>
</head>
<body>
  <main>
    <p>404 / Not found</p>
    <h1>Không tìm thấy trang</h1>
    <p>Đường dẫn này không còn tồn tại hoặc không được công khai. Quay về trang chủ để tiếp tục xem sản phẩm, dự án và tài liệu SMARTSTEAM.</p>
    <a href="/vi/welcome/">Về trang chủ</a>
  </main>
</body>
</html>
